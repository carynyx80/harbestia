<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.belt{position:absolute;left:40px;right:40px;top:430px;height:70px;background:var(--navy);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background-image:repeating-linear-gradient(90deg,transparent 0 58px,rgba(242,239,232,.25) 58px 60px)}
.part{position:absolute;top:330px;width:120px;height:100px;background:#fff;border:2px solid var(--ink);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.part::before{content:"";position:absolute;left:34px;top:22px;width:48px;height:48px;border-radius:50%;border:2px solid var(--ink)}
.part .m{font-size:12px}
.bad{border-color:var(--sig);border-width:3px}
.bad::after{content:"";position:absolute;left:70px;top:14px;width:3px;height:44px;background:var(--sig);transform:rotate(28deg)}
.box{position:absolute;left:822px;top:300px;width:176px;height:160px;border:4px solid var(--sig)}
.box .m{position:absolute;left:-4px;top:-38px;background:var(--sig);color:#fff;padding:6px 10px;font-weight:700;font-size:16px}
.cam{position:absolute;left:830px;top:80px;width:160px;height:120px;background:var(--ink)}
.cam::after{content:"";position:absolute;left:50px;bottom:-30px;width:60px;height:30px;background:var(--ink)}
.lens{position:absolute;left:52px;top:32px;width:56px;height:56px;border-radius:50%;background:var(--sig);border:6px solid #333}
.cone{position:absolute;left:770px;top:230px;width:280px;height:100px;background:linear-gradient(rgba(255,77,0,.12),rgba(255,77,0,0));clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
.ret{position:absolute;left:1240px;top:120px;width:220px;height:220px;border:2px solid var(--ink);border-radius:50%}
.ret::before,.ret::after{content:"";position:absolute;background:var(--ink)}
.ret::before{left:50%;top:-24px;bottom:-24px;width:2px}
.ret::after{top:50%;left:-24px;right:-24px;height:2px}
.ret i{position:absolute;inset:70px;border:3px solid var(--sig);border-radius:50%}
.title{position:absolute;left:120px;bottom:90px;font-size:150px}
.title span{color:var(--sig)}
.cap{position:absolute;right:140px;bottom:110px;text-align:right;line-height:1.7}
.top{position:absolute;left:80px;top:62px;right:80px;display:flex;justify-content:space-between}
.read{position:absolute;left:1240px;top:540px;line-height:1.8}
</style></head><body>
<div class="grid"></div><div class="frame"></div>
<div class="top m"><span>Harvestia · Sample campaign · Fictional</span><span>Line 03 · Shift B</span></div>
<div class="cone"></div>
<div class="cam"><div class="lens"></div></div>
<div class="belt"></div>
<div class="part" style="left:120px"><span class="m">OK 0.99</span></div>
<div class="part" style="left:300px"><span class="m">OK 0.98</span></div>
<div class="part" style="left:480px"><span class="m">OK 0.99</span></div>
<div class="part" style="left:660px"><span class="m">OK 0.97</span></div>
<div class="part bad" style="left:850px;top:330px"><span class="m" style="color:#FF4D00">CRACK 0.94</span></div>
<div class="part" style="left:1040px"><span class="m">OK 0.99</span></div>
<div class="box"><span class="m">DEFECT</span></div>
<div class="ret"><i></i></div>
<div class="read m">Parts inspected · 4,812<br>Flagged · 37<br><span style="color:#FF4D00">Scrap avoided · 0.8%</span></div>
<div class="title d">Ferrolab<span>.</span></div>
<div class="cap m">AI inspection cameras<br>for small factories</div>
</body></html>
